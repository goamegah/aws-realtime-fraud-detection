name: Deploy Infra and Artifacts

on:
    workflow_dispatch:
        inputs:
            terraform_directory:
                description: 'Terraform working directory'
                default: 'devops/infra/main'
                required: true
            python_target:
                description: 'Deployment target for Python wrapper (glue|sagemaker|all)'
                default: 'all'
                required: true
            s3_bucket:
                description: 'S3 bucket to upload artifacts to'
                required: true
            aws_region:
                description: 'AWS region'
                default: 'eu-west-1'
                required: true

permissions:
    id-token: write
    contents: read

jobs:
    deploy:
        runs-on: ubuntu-latest
        env:
            AWS_REGION: ${{ inputs.aws_region }}
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            
            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: '3.10'
            
            - name: Install Python deps
              run: |
                  python -m pip install --upgrade pip
                  python -m pip install -e .[all]
            
            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
                  aws-region: ${{ env.AWS_REGION }}
            
            - name: Terraform Init
              working-directory: ${{ inputs.terraform_directory }}
              run: terraform init -input=false
            
            - name: Terraform Apply
              working-directory: ${{ inputs.terraform_directory }}
              env:
                  TF_VAR_aws_region: ${{ env.AWS_REGION }}
              run: |
                  terraform apply -auto-approve
            
            - name: Read Terraform outputs
              id: tfout
              working-directory: ${{ inputs.terraform_directory }}
              run: |
                  echo "STREAM_BUCKET=$(terraform output -raw spark_streaming_bucket_name)" >> $GITHUB_OUTPUT
            
            - name: Deploy artifacts via Python wrapper
              env:
                  SPARK_SOLUTION_S3_BUCKET: ${{ steps.tfout.outputs.STREAM_BUCKET }}
                  SPARK_SOLUTION_NAME: fraud-detection
                  AWS_REGION: ${{ env.AWS_REGION }}
              run: |
                  if [ "${{ inputs.python_target }}" = "glue" ]; then
                    python -m devops.deploy.cli --bucket "${{ steps.tfout.outputs.STREAM_BUCKET }}" --region "${{ env.AWS_REGION }}";
                  elif [ "${{ inputs.python_target }}" = "sagemaker" ]; then
                    echo "No notebooks upload required; skipping.";
                  else
                    python -m devops.deploy.cli --bucket "${{ steps.tfout.outputs.STREAM_BUCKET }}" --region "${{ env.AWS_REGION }}";
                  fi
